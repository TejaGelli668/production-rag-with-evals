# Stack: company+year filters and cross-encoder rerank (no BM25). Same index as e1_full.
name: stack_filter_rerank
corpus: full
parser: pymupdf
chunker: {type: fixed, size: 500, overlap: 50}
retriever: {type: dense, top_k: 5, filters: company_year, candidates: 50, rerank: true}
generator:
  provider: ollama
  model: qwen3:14b
