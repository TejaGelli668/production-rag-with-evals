# Stack on page-bounded chunks: E2 (page) + company/year filters + cross-encoder rerank.
name: stack_page_filter_rerank
corpus: full
parser: pymupdf
chunker: {type: page, size: 500, overlap: 50}
retriever: {type: dense, top_k: 5, filters: company_year, candidates: 50, rerank: true}
generator:
  provider: ollama
  model: qwen3:14b
