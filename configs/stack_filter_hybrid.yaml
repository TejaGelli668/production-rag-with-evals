# Stack: company+year filters and hybrid dense + BM25 (no rerank). Same index as e1_full.
name: stack_filter_hybrid
corpus: full
parser: pymupdf
chunker: {type: fixed, size: 500, overlap: 50}
retriever: {type: hybrid, top_k: 5, filters: company_year, candidates: 50, rerank: false}
generator:
  provider: ollama
  model: qwen3:14b
