[project]
name = "rag"
version = "0.1.0"
description = "Production RAG over SEC filings, built and tuned through evaluation on FinanceBench."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.11.0",
    "bm25s>=0.3.11",
    "fastapi>=0.142.2",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.24",
    "pymupdf4llm>=1.28.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.4",
    "tqdm>=4.66",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
]
tracing = [
    "arize-phoenix-otel>=0.17.2",
    "openinference-semantic-conventions>=0.1.41",
]
ui = [
    "streamlit>=1.64.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
rag = "rag.cli:main"

[tool.uv]
# The API, UI and tracing groups are part of the app, so a plain `uv sync` installs them all.
default-groups = ["dev", "ui", "tracing"]

# On Linux (CI, servers) use CPU-only PyTorch: the default wheels bundle CUDA (several GB).
# macOS gets the regular PyPI build, which includes the MPS (Apple GPU) backend.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
